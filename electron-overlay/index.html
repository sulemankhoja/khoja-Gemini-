<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>khoja bot — overlay</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 8px; }
      #overlay { width: 320px }
      button { margin: 4px }
      ul { padding-left: 18px }
      header { display:flex; justify-content:space-between; align-items:center }
      .drag { -webkit-app-region: drag; }
      .no-drag { -webkit-app-region: no-drag; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <header>
        <div class="drag">khoja bot</div>
        <div class="no-drag">v0.1</div>
      </header>
      <div>
        <button id="start">Start</button>
        <button id="stop">Stop</button>
      </div>
      <h4>Actions</h4>
      <ul id="actions"></ul>
      <div>
        <div>Expected total gain: <span id="expectedTotal">-</span></div>
        <div>Actual total gain: <span id="actualTotal">-</span></div>
      </div>
      <div>
        <h5>Logs</h5>
        <pre id="logs" style="height:60px; overflow:auto; background:#f5f5f5"></pre>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
